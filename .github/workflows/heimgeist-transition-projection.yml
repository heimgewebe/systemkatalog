name: Bind Heimgeist transition to primary freeze source

on:
  push:
    branches:
      - chore/heimgeist-transition-truth
    paths:
      - .github/workflows/heimgeist-transition-projection.yml

permissions:
  contents: write

jobs:
  repair:
    name: Bind exact Heimgeist source and fully validate V2
    if: github.repository == 'heimgewebe/systemkatalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: chore/heimgeist-transition-truth
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Patch, commit locally, fully validate, then push
        env:
          CLEAN_BRANCH: chore/heimgeist-transition-truth-v2
          EXPECTED_HEAD: c71cbd6c404ff9125fa4da7c8682e1086334f30e
          EXPECTED_BINDINGS_BLOB: 09d2e1d1e47aea3eba3f2c02d7fcaeba96c5d4a8
          HEIMGEIST_FREEZE: 4b92bae2c684860399b333cd908878726e6ef4e8
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${CLEAN_BRANCH}:refs/remotes/origin/${CLEAN_BRANCH}"
          observed="$(git rev-parse "refs/remotes/origin/${CLEAN_BRANCH}")"
          if [[ "${observed}" != "${EXPECTED_HEAD}" ]]; then
            echo "V2 head moved: expected ${EXPECTED_HEAD}, got ${observed}" >&2
            exit 1
          fi

          clean="${RUNNER_TEMP}/heimgeist-transition-v2-source"
          git worktree add --detach "${clean}" "refs/remotes/origin/${CLEAN_BRANCH}"
          git -C "${clean}" switch -c repair-source
          test "$(git -C "${clean}" rev-parse HEAD:registry/ecosystem/source-bindings.v1.json)" = "${EXPECTED_BINDINGS_BLOB}"

          source_repo="${RUNNER_TEMP}/heimgeist-source"
          git init "${source_repo}"
          git -C "${source_repo}" remote add origin https://github.com/heimgewebe/heimgeist.git
          git -C "${source_repo}" fetch --depth=1 origin "${HEIMGEIST_FREEZE}"
          git -C "${source_repo}" show "${HEIMGEIST_FREEZE}:README.md" > "${RUNNER_TEMP}/heimgeist-freeze-README.md"
          readme_sha256="$(sha256sum "${RUNNER_TEMP}/heimgeist-freeze-README.md" | awk '{print $1}')"
          if [[ ! "${readme_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "invalid Heimgeist README SHA-256" >&2
            exit 1
          fi

          BINDINGS_PATH="${clean}/registry/ecosystem/source-bindings.v1.json" \
          README_SHA256="${readme_sha256}" \
          HEIMGEIST_FREEZE="${HEIMGEIST_FREEZE}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['BINDINGS_PATH'])
          digest = os.environ['README_SHA256']
          freeze = os.environ['HEIMGEIST_FREEZE']
          doc = json.loads(path.read_text(encoding='utf-8'))
          matches = [item for item in doc['systems'] if item.get('system') == 'repo:heimgeist']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one Heimgeist system binding, got {len(matches)}')
          item = matches[0]
          source = item.get('source', {})
          locator = source.get('locator', {})
          expected = {
              'repository': 'heimgewebe/heimgeist',
              'commit': '2d657297e9875cf0ec12932b3391fc4c0d8a246a',
              'defaultBranch': 'main',
          }
          for key, value in expected.items():
              if source.get(key) != value:
                  raise SystemExit(f'Heimgeist source {key} drift: {source.get(key)!r} != {value!r}')
          if (
              locator.get('kind') != 'file'
              or locator.get('path') != 'README.md'
              or locator.get('contentSha256') != 'be7264d0ac459bc06a131c4e357361dcee25d836cad907ba645f2a4f7ad91e32'
              or item.get('method') != 'repository_primary_document'
          ):
              raise SystemExit(f'unexpected Heimgeist source binding: {item!r}')

          source['commit'] = freeze
          locator['contentSha256'] = digest
          item['reviewedAt'] = '2026-08-31T12:05:00+02:00'
          item['uncertainty'] = 0.01
          doc['observedAt'] = '2026-08-31T12:05:00+02:00'
          path.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          mapfile -t changed < <(git -C "${clean}" diff --name-only)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "registry/ecosystem/source-bindings.v1.json" ]]; then
            printf 'unexpected source repair paths:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi

          git -C "${clean}" config user.name 'github-actions[bot]'
          git -C "${clean}" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "${clean}" add registry/ecosystem/source-bindings.v1.json
          git -C "${clean}" commit -m 'review: bind Heimgeist transition to freeze README'
          candidate="$(git -C "${clean}" rev-parse HEAD)"
          test -z "$(git -C "${clean}" status --porcelain)"

          (
            cd "${clean}"
            export PYTHONDONTWRITEBYTECODE=1
            export SYSTEMKATALOG_DURABLE_SOURCE_REF="refs/remotes/origin/${CLEAN_BRANCH}"
            ./scripts/ci/validate-repository.sh
            git diff --check "${EXPECTED_HEAD}".."${candidate}"
          )

          test "$(git -C "${clean}" rev-parse HEAD)" = "${candidate}"
          test -z "$(git -C "${clean}" status --porcelain)"
          git -C "${clean}" push origin "HEAD:refs/heads/${CLEAN_BRANCH}"
