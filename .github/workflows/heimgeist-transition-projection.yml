name: Repair exact dashboard relation provenance set

on:
  push:
    branches:
      - chore/heimgeist-transition-truth
    paths:
      - .github/workflows/heimgeist-transition-projection.yml

permissions:
  contents: write

jobs:
  repair:
    name: Repair three exact stale dashboard relation bindings
    if: github.repository == 'heimgewebe/systemkatalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: chore/heimgeist-transition-truth
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Patch validator-proven stale dashboard relations on V2
        env:
          CLEAN_BRANCH: chore/heimgeist-transition-truth-v2
          EXPECTED_HEAD: 41a8c900577f82329da819c98960f585b72dbc0c
          DATA_COMMIT: d5a4a6cf5c0addda429d9610bada6ac456fae2a9
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${CLEAN_BRANCH}:refs/remotes/origin/${CLEAN_BRANCH}"
          observed="$(git rev-parse "refs/remotes/origin/${CLEAN_BRANCH}")"
          if [[ "${observed}" != "${EXPECTED_HEAD}" ]]; then
            echo "V2 head moved: expected ${EXPECTED_HEAD}, got ${observed}" >&2
            exit 1
          fi

          clean="${RUNNER_TEMP}/heimgeist-transition-v2-repair"
          git worktree add --detach "${clean}" "refs/remotes/origin/${CLEAN_BRANCH}"
          git -C "${clean}" switch -c repair-local
          git -C "${clean}" merge-base --is-ancestor "${DATA_COMMIT}" HEAD
          tag="systemkatalog-provenance-v1/${DATA_COMMIT}"
          test "$(git -C "${clean}" rev-parse "refs/tags/${tag}^{commit}")" = "${DATA_COMMIT}"

          CLEAN_ROOT="${clean}" DATA_COMMIT="${DATA_COMMIT}" python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['CLEAN_ROOT'])
          data_commit = os.environ['DATA_COMMIT']
          bindings_path = root / 'registry/ecosystem/source-bindings.v1.json'
          edges_path = root / 'registry/ecosystem/edges.json'
          doc = json.loads(bindings_path.read_text(encoding='utf-8'))
          current_edges_bytes = edges_path.read_bytes()
          current_edges = json.loads(current_edges_bytes)['edges']
          current_digest = hashlib.sha256(current_edges_bytes).hexdigest()

          expected_keys = {
              ('repo:bureau', 'service:heim-pc-chatgpt-dashboard', 'provides'),
              ('repo:grabowski', 'service:heim-pc-chatgpt-dashboard', 'provides'),
              ('service:heim-pc-chatgpt-dashboard', 'repo:leitstand', 'scope_boundary'),
          }

          def is_ancestor(commit: str) -> bool:
              result = subprocess.run(
                  ['git', 'merge-base', '--is-ancestor', commit, 'HEAD'],
                  cwd=root,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if result.returncode == 0:
                  return True
              if result.returncode == 1:
                  return False
              raise SystemExit(f'cannot classify source commit ancestry: {commit}')

          candidates = []
          for index, item in enumerate(doc['relations']):
              source = item.get('source', {})
              locator = source.get('locator', {})
              if (
                  source.get('repository') != 'heimgewebe/systemkatalog'
                  or locator.get('kind') != 'json_pointer'
                  or locator.get('path') != 'registry/ecosystem/edges.json'
              ):
                  continue
              commit = source.get('commit')
              if not isinstance(commit, str) or commit == 'redacted':
                  continue
              if is_ancestor(commit):
                  continue
              if locator.get('contentSha256') == current_digest:
                  continue
              relation = item.get('relation', {})
              key = (relation.get('from'), relation.get('to'), relation.get('type'))
              candidates.append((index, key, item))

          candidate_keys = {key for _, key, _ in candidates}
          if len(candidates) != 3 or candidate_keys != expected_keys:
              rendered = [
                  {
                      'index': index,
                      'relation': item.get('relation'),
                      'commit': item.get('source', {}).get('commit'),
                      'pointer': item.get('source', {}).get('locator', {}).get('pointer'),
                  }
                  for index, _, item in candidates
              ]
              raise SystemExit(
                  'expected exactly the three known dashboard relation bindings; '
                  f'got {len(candidates)}: {rendered!r}'
              )

          patched = []
          for relation_index, key, item in candidates:
              source = item['source']
              locator = source['locator']
              old_commit = source['commit']
              pointer = locator['pointer']
              prefix = '/edges/'
              if not isinstance(pointer, str) or not pointer.startswith(prefix):
                  raise SystemExit(f'unexpected source pointer: {pointer!r}')
              raw_index = pointer[len(prefix):]
              if not raw_index.isdigit():
                  raise SystemExit(f'unexpected source pointer index: {pointer!r}')
              old_index = int(raw_index)

              old_edges_bytes = subprocess.check_output(
                  ['git', 'show', f'{old_commit}:registry/ecosystem/edges.json'], cwd=root
              )
              old_digest = hashlib.sha256(old_edges_bytes).hexdigest()
              if old_digest != locator.get('contentSha256'):
                  raise SystemExit(
                      f'source relation {relation_index} old digest mismatch: '
                      f'{old_digest} != {locator.get("contentSha256")}'
                  )
              old_edges = json.loads(old_edges_bytes)['edges']
              if old_index >= len(old_edges):
                  raise SystemExit(f'source relation {relation_index} old pointer out of range')
              old_edge = old_edges[old_index]
              old_key = (old_edge.get('from'), old_edge.get('to'), old_edge.get('type'))
              if old_key != key:
                  raise SystemExit(
                      f'source relation {relation_index} old pointer identity mismatch: '
                      f'{old_key!r} != {key!r}'
                  )

              matches = [
                  index for index, edge in enumerate(current_edges)
                  if (edge.get('from'), edge.get('to'), edge.get('type')) == key
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f'source relation {relation_index} current identity count is '
                      f'{len(matches)} for {key!r}'
                  )
              new_index = matches[0]
              source['commit'] = data_commit
              locator['pointer'] = f'/edges/{new_index}'
              locator['contentSha256'] = current_digest
              item['reviewedAt'] = '2026-08-31'
              patched.append(
                  {
                      'relationIndex': relation_index,
                      'relation': item['relation'],
                      'oldCommit': old_commit,
                      'newCommit': data_commit,
                      'oldPointer': pointer,
                      'newPointer': locator['pointer'],
                  }
              )

          doc['observedAt'] = '2026-08-31T11:58:00+02:00'
          bindings_path.write_text(
              json.dumps(doc, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print(json.dumps({'patched': patched}, sort_keys=True))
          PY

          (
            cd "${clean}"
            python3 scripts/validate_ecosystem_map.py
            python3 scripts/render_ecosystem_registry_map.py --check
            python3 scripts/render_system_catalog.py --check
            python3 scripts/write_ecosystem_map_artifact_manifest.py \
              --check \
              --durable-source-ref "refs/remotes/origin/${CLEAN_BRANCH}"
            git diff --check
          )

          mapfile -t changed < <(git -C "${clean}" diff --name-only)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "registry/ecosystem/source-bindings.v1.json" ]]; then
            printf 'unexpected repair paths:\n' >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi

          git -C "${clean}" config user.name 'github-actions[bot]'
          git -C "${clean}" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "${clean}" add registry/ecosystem/source-bindings.v1.json
          git -C "${clean}" commit -m 'chore(catalog): repair dashboard relation provenance'
          git -C "${clean}" push origin "HEAD:refs/heads/${CLEAN_BRANCH}"
